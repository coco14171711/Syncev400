<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sacred.sh</title>
<style>
  :root{
    --bg: #000000;
    --chrome: #c8c8c4;
    --chrome-dark: #8a8a86;
    --chrome-light: #f0f0ec;
    --ink: #e8e6e1;
    --ink-dim: #9c9a95;
    --rust: #8a3a34;
    --steel: #5c6b78;
    --border-dark: #4a4a48;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
    font-family: Tahoma, Verdana, Geneva, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #snow{
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ---------- roster ---------- */

  .roster{
    position: fixed;
    top: 22px;
    left: 22px;
    z-index: 2;
    user-select: none;
  }

  .roster-title{
    font-family: 'Courier New', Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: #ffffff;
    margin-bottom: 14px;
    white-space: nowrap;
  }

  .roster-title .caret{
    display: inline-block;
    margin-left: 1px;
    animation: caret-blink 1s step-end infinite;
  }

  @keyframes caret-blink{
    0%, 49%{ opacity: 1; }
    50%, 100%{ opacity: 0; }
  }

  .icons{
    display: flex;
    flex-wrap: wrap;
    gap: 22px 26px;
    max-width: 120px;
  }

  .icon{
    background: none;
    border: none;
    padding: 4px;
    width: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    border-radius: 3px;
  }

  .icon:hover,
  .icon:focus-visible{
    background: rgba(92,107,120,0.22);
    outline: none;
  }

  .icon img{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .icon span{
    font-family: 'Courier New', Consolas, monospace;
    font-size: 11px;
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  }

  /* ---------- profile window ---------- */

  .win{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: min(260px, 82vw);
    background: rgba(8,8,10,0.82);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    border: 1px solid #050505;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.6);
    z-index: 20;
  }

  .win-titlebar{
    background: linear-gradient(180deg, #4f8fe0, #1c3f73);
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 5px 4px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    user-select: none;
    touch-action: none;
  }

  .win-controls{
    display: flex;
    gap: 2px;
  }

  .win-btn{
    width: 18px;
    height: 16px;
    background: var(--chrome);
    border: 1px solid #050505;
    box-shadow: inset -1px -1px 0 var(--chrome-dark), inset 1px 1px 0 var(--chrome-light);
    font-size: 10px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #111;
    cursor: pointer;
    padding: 0;
  }

  .win-close:hover{
    background: #b5382f;
    color: #fff;
  }

  .win-body{
    padding: 22px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-align: center;
  }

  .win-photo{
    width: 120px;
    height: 120px;
    object-fit: cover;
    margin-bottom: 14px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 52%, transparent 82%);
    mask-image: radial-gradient(ellipse at center, #000 52%, transparent 82%);
  }

  .win-name{
    font-size: 14px;
    font-weight: bold;
    color: #ffffff;
  }

  .win-role{
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }

  .win-tg{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 6px 14px;
    color: #ffffff;
    text-decoration: none;
    font-size: 12px;
  }

  .win-tg:hover{
    background: rgba(255,255,255,0.2);
  }

  /* ---------- pads panel (small draggable window) ---------- */

  .pads-win{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: min(440px, 90vw);
    background: #000;
    border: 1px solid #050505;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.6);
    z-index: 20;
  }

  .pads-body{
    font-family: 'Courier New', Consolas, monospace;
    color: #ffffff;
    padding: 10px 20px 8px;
    max-height: 56vh;
    overflow-y: auto;
  }

  .pad-row{
    position: relative;
    padding: 22px 2px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 15px;
    letter-spacing: 0.02em;
    color: #ffffff;
  }

  .pad-row:last-child{ border-bottom: none; }

  .pad-dot{
    position: absolute;
    top: 4px;
    left: 50%;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--ink-dim);
    animation: blink 2.4s ease-in-out infinite;
  }

  @keyframes blink{
    0%, 100%{ opacity: 0.25; }
    50%{ opacity: 1; }
  }

  .soon{ color: #ffffff; }

  .pad-ellipsis{ display: inline-block; width: 1.6em; }

  /* ---------- start menu ---------- */

  .start-menu{
    position: fixed;
    left: 4px;
    bottom: 48px;
    z-index: 12;
    display: flex;
    background: var(--chrome);
    border: 1px solid #050505;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.6);
  }

  .start-side{
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    background: linear-gradient(180deg, var(--steel), #34424c);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 0.05em;
    padding: 10px 6px;
    display: flex;
    align-items: flex-end;
  }

  .start-items{
    width: 190px;
    padding: 4px;
  }

  .start-item{
    padding: 7px 10px;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
  }

  .start-item:not(.disabled):hover{
    background: var(--steel);
    color: #fff;
  }

  .start-item.disabled{
    color: var(--chrome-dark);
    cursor: default;
  }

  .start-item.shutdown{ color: var(--rust); font-weight: bold; }

  .start-items hr{
    border: none;
    border-top: 1px solid var(--chrome-dark);
    border-bottom: 1px solid var(--chrome-light);
    margin: 4px 2px;
  }

  /* ---------- taskbar ---------- */

  .taskbar{
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 44px;
    background: var(--chrome);
    border-top: 1px solid var(--chrome-light);
    box-shadow: inset 0 1px 0 var(--chrome-light);
    display: flex;
    align-items: center;
    padding: 0 6px;
    z-index: 11;
    font-size: 13px;
  }

  .start-btn{
    display: flex;
    align-items: center;
    gap: 7px;
    height: 32px;
    padding: 0 14px;
    background: var(--chrome);
    border: 1px solid #050505;
    box-shadow: inset -1px -1px 0 var(--chrome-dark), inset 1px 1px 0 var(--chrome-light);
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    color: #111;
  }

  .start-btn.active{
    box-shadow: inset 1px 1px 0 var(--chrome-dark), inset -1px -1px 0 var(--chrome-light);
  }

  .start-logo{
    width: 16px;
    height: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
  }

  .start-logo span:nth-child(1){ background: var(--rust); }
  .start-logo span:nth-child(2){ background: var(--steel); }
  .start-logo span:nth-child(3){ background: var(--chrome-light); }
  .start-logo span:nth-child(4){ background: #34424c; }

  .quicklaunch{
    display: flex;
    gap: 5px;
    margin-left: 10px;
    padding-left: 10px;
    border-left: 1px solid var(--chrome-dark);
  }

  .tb-btn{
    width: 30px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chrome);
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    color: #111;
  }

  .tb-btn:hover{
    border: 1px solid #050505;
    box-shadow: inset 1px 1px 0 var(--chrome-dark), inset -1px -1px 0 var(--chrome-light);
  }

  .tray{
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 14px;
    border: 1px solid var(--chrome-dark);
    box-shadow: inset 1px 1px 0 var(--chrome-dark);
    color: #111;
    font-size: 13px;
  }

  /* ---------- watermark ---------- */

  .watermark{
    position: fixed;
    right: 14px;
    bottom: 52px;
    z-index: 1;
    text-align: right;
    color: rgba(232,230,225,0.55);
    font-size: 13px;
    line-height: 1.4;
    user-select: none;
  }

  .watermark small{ font-size: 11px; color: rgba(232,230,225,0.4); }

  /* ---------- shutdown overlay ---------- */

  .shutdown-overlay{
    position: fixed;
    inset: 0;
    background: #000;
    color: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 14px;
    z-index: 50;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  .shutdown-overlay.show{
    opacity: 1;
    pointer-events: all;
  }

  [hidden]{ display: none !important; }

  /* ---------- start overlay ---------- */

  .start-overlay{
    position: fixed;
    inset: 0;
    background: #000;
    color: #ffffff;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Consolas, monospace;
    font-size: 15px;
    letter-spacing: 0.05em;
    cursor: pointer;
    user-select: none;
    transition: opacity 0.9s ease;
  }

  .start-overlay p{
    animation: overlay-pulse 1.6s ease-in-out infinite;
  }

  @keyframes overlay-pulse{
    0%, 100%{ opacity: 0.45; }
    50%{ opacity: 1; }
  }

  .start-overlay.fade{
    opacity: 0;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce){
    .start-overlay p{ animation: none; opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .pad-dot{ animation: none; opacity: 1; }
  }
</style>
</head>

<script>
  // ---------- snow ----------
  const canvas = document.getElementById('snow');
  const ctx = canvas.getContext('2d');
  let W, H, flakes;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeFlakes(n){
    flakes = Array.from({length: n}, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.4,
      speed: Math.random() * 0.4 + 0.1,
      drift: (Math.random() - 0.5) * 0.15
    }));
  }

  function drawSnow(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(232,230,225,0.85)';
    for(const f of flakes){
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
      f.y += f.speed;
      f.x += f.drift;
      if(f.y > H){ f.y = -2; f.x = Math.random() * W; }
    }
    requestAnimationFrame(drawSnow);
  }

  // ---------- typewriter ----------
  function typeWriter(el, text, speed){
    let i = 0;
    (function step(){
      el.textContent = text.slice(0, i);
      i++;
      if(i <= text.length) setTimeout(step, speed);
    })();
  }
  typeWriter(document.getElementById('rosterText'), 'Sacred.sh Roster', 70);

  // ---------- ping-pong ellipsis ----------
  const dotStates = ['.', '..', '...', '..'];
  let dotIndex = 0;
  function pingDots(){
    dotIndex = (dotIndex + 1) % dotStates.length;
    document.querySelectorAll('.pad-ellipsis').forEach(el => {
      el.textContent = dotStates[dotIndex];
    });
  }
  document.querySelectorAll('.pad-ellipsis').forEach(el => { el.textContent = dotStates[0]; });
  setInterval(pingDots, 450);

  // ---------- draggable windows ----------
  function makeDraggable(win, handle){
    let dragging = false, offsetX = 0, offsetY = 0;
    handle.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.win-close')) return;
      const rect = win.getBoundingClientRect();
      win.style.left = rect.left + 'px';
      win.style.top = rect.top + 'px';
      win.style.transform = 'none';
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      dragging = true;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;
      x = Math.max(4, Math.min(window.innerWidth - win.offsetWidth - 4, x));
      y = Math.max(4, Math.min(window.innerHeight - win.offsetHeight - 4, y));
      win.style.left = x + 'px';
      win.style.top = y + 'px';
    });
    ['pointerup', 'pointercancel'].forEach(evt => {
      handle.addEventListener(evt, () => { dragging = false; });
    });
  }

  resize();
  makeFlakes(140);
  window.addEventListener('resize', () => { resize(); });
  if(!reduceMotion){ drawSnow(); } else { drawSnow(); drawSnow(); }

  // ---------- clock ----------
  function tick(){
    const d = new Date();
    let h = d.getHours();
    const m = d.getMinutes().toString().padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
  }
  tick();
  setInterval(tick, 1000 * 15);

  // ---------- profile windows ----------
  const profileWin = document.getElementById('profileWin');
  const winTitle = document.getElementById('winTitle');
  const winAvatar = document.getElementById('winAvatar');
  const winName = document.getElementById('winName');
  const winRole = document.getElementById('winRole');
  const winTelegram = document.getElementById('winTelegram');
  const winTgHandle = document.getElementById('winTgHandle');

  document.querySelectorAll('.icon').forEach(btn => {
    btn.addEventListener('click', () => {
      winTitle.textContent = btn.dataset.name;
      winAvatar.src = btn.dataset.avatar;
      winName.textContent = btn.dataset.name;
      winRole.textContent = btn.dataset.role;
      winTgHandle.textContent = btn.dataset.handle;
      winTelegram.href = btn.dataset.url;
      profileWin.hidden = false;
    });
  });
  document.getElementById('winClose').addEventListener('click', () => profileWin.hidden = true);
  makeDraggable(profileWin, profileWin.querySelector('.win-titlebar'));

  // ---------- pads ----------
  const padsPanel = document.getElementById('padsPanel');
  document.getElementById('padsBtn').addEventListener('click', () => padsPanel.hidden = false);
  document.getElementById('padsClose').addEventListener('click', () => padsPanel.hidden = true);
  makeDraggable(padsPanel, padsPanel.querySelector('.win-titlebar'));

  // ---------- start menu ----------
  const startMenu = document.getElementById('startMenu');
  const startBtn = document.getElementById('startBtn');

  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    startMenu.hidden = !startMenu.hidden;
    startBtn.classList.toggle('active', !startMenu.hidden);
  });

  document.addEventListener('click', (e) => {
    if(!startMenu.hidden && !startMenu.contains(e.target) && e.target !== startBtn){
      startMenu.hidden = true;
      startBtn.classList.remove('active');
    }
  });

  document.getElementById('helpItem').addEventListener('click', () => {
    alert('this site is a small corner of the internet. click around.');
  });
  document.getElementById('runItem').addEventListener('click', () => {
    const cmd = prompt('Run:', '');
    if(cmd) alert(`'${cmd}' is not recognized. try clicking things instead.`);
  });

  // ---------- shutdown ----------
  document.getElementById('shutdownItem').addEventListener('click', () => {
    document.getElementById('shutdownOverlay').classList.add('show');
  });

  // ---------- sound ----------
  const bgm = document.getElementById('bgm');
  let playing = false;

  // ---------- start overlay ----------
  const startOverlay = document.getElementById('startOverlay');

  function enterSite(){
    if(startOverlay.classList.contains('fade')) return;
    startOverlay.classList.add('fade');
    bgm.play().catch(() => {});
    playing = true;
    setTimeout(() => { startOverlay.hidden = true; }, 950);
  }

  startOverlay.addEventListener('click', enterSite);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !startOverlay.hidden){
      e.preventDefault();
      enterSite();
    }
  });
</script>

</body>
</html>
